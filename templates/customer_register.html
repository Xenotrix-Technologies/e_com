{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AR Handlooms</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: 'Nunito Sans', sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#f5f7fa,#c3cfe2);
            padding:20px;
        }

        .login-wrapper{
            width:100%;
            max-width:500px;
            background:#fff;
            border-radius:16px;
            box-shadow:0 10px 30px rgba(0,0,0,0.12);
            padding:32px 28px;
        }

        .login-wrapper h2{
            text-align:center;
            margin-bottom:8px;
            color:#111;
            font-weight: 700;
        }

        .sub-text{
            text-align:center;
            color:#666;
            font-size:14px;
            margin-bottom:24px;
        }

        .alert{
            padding:12px 14px;
            border-radius:8px;
            margin-bottom:15px;
            font-size:14px;
        }

        .alert-error{
            background:#ffe5e5;
            color:#b30000;
        }

        .alert-success{
            background:#e7f8ec;
            color:#1f7a3d;
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .form-group{
            margin-bottom:15px;
        }

        .form-group label{
            display:block;
            margin-bottom:6px;
            font-size:14px;
            font-weight:600;
            color:#333;
        }

        .form-control{
            width:100%;
            padding:10px 14px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:14px;
            outline:none;
            transition:0.3s;
        }

        .form-control:focus{
            border-color:#111;
            box-shadow:0 0 0 3px rgba(17,17,17,0.1);
        }

        .btn-register{
            width:100%;
            padding:12px;
            border:none;
            border-radius:10px;
            background:#111;
            color:#fff;
            font-size:15px;
            font-weight:700;
            cursor:pointer;
            transition:0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .btn-register:hover{
            background:#333;
        }

        .bottom-text{
            text-align:center;
            margin-top:18px;
            font-size:14px;
            color:#555;
        }

        .bottom-text a{
            text-decoration:none;
            color:#111;
            font-weight:700;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="{% url 'index' %}">
            <img src="{% static 'img/logo.png' %}" alt="AR Handlooms" style="max-width: 150px;">
        </a>
    </div>
    <h2>Create Account</h2>
    <p class="sub-text">Join us for a better shopping experience</p>

    {% if messages %}
        {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST" action="{% url 'customer_register' %}">
        {% csrf_token %}

        <div class="form-row">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" name="first_name" id="first_name" class="form-control" required placeholder="First Name">
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" name="last_name" id="last_name" class="form-control" required placeholder="Last Name">
            </div>
        </div>

        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" name="username" id="username" class="form-control" required placeholder="Create Username">
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" required placeholder="Email Address">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="Password">
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" required placeholder="Confirm">
            </div>
        </div>

        <button type="submit" class="btn-register">Register Now</button>

        <p class="bottom-text">
            Already have an account?
            <a href="{% url 'customer_login' %}">Sign In</a>
        </p>
    </form>
</div>

</body>
</html>
