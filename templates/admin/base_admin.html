{% load static %}

<!DOCTYPE html>
<html>
<head>

<title>Admin Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>

body{
background:#f0f2f5;
font-family: 'Outfit', sans-serif;
color: #333;
}

.sidebar{
width:260px;
height:100vh;
background:#1a1c1e;
position:fixed;
padding-top:20px;
box-shadow: 4px 0 10px rgba(0,0,0,0.1);
z-index: 1000;
}

.sidebar h4 {
    font-weight: 700;
    letter-spacing: 1px;
    padding: 20px;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    margin-bottom: 20px;
}

.sidebar a{
display:flex;
align-items: center;
color:rgba(255,255,255,0.7);
padding: 12px 25px;
text-decoration:none;
transition: all 0.3s;
font-size: 15px;
font-weight: 500;
}

.sidebar a i {
    margin-right: 12px;
    font-size: 18px;
}

.sidebar a:hover{
background: rgba(255,255,255,0.05);
color: #fff;
}

.sidebar a.active {
    background: #e11f21;
    color: #fff;
}

.content{
margin-left:260px;
padding:40px;
}

.card{
border:none;
border-radius: 12px;
box-shadow:0 5px 15px rgba(0,0,0,0.05);
transition: transform 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

.btn-primary {
    background: #1a1c1e;
    border: none;
    border-radius: 8px;
}

.btn-primary:hover {
    background: #e11f21;
}

</style>

</head>

<body>

<div class="sidebar">

<h4 class="text-center text-white">AR ADMIN</h4>

<a href="{% url 'admin_dashboard' %}"><i class="fa fa-gauge"></i> Dashboard</a>
<a href="{% url 'admin_add_product' %}"><i class="fa fa-plus"></i> Add Products</a>
<a href="{% url 'inventory' %}"><i class="fa fa-boxes"></i> Inventory</a>
<a href="{% url 'admin_categories' %}"><i class="fa fa-tags"></i> Categories</a>
<a href="{% url 'admin_orders' %}"><i class="fa fa-shopping-bag"></i> Orders</a>
<a href="{% url 'admin_reports' %}"><i class="fa fa-chart-line"></i> Reports</a>
<div style="margin-top: auto; padding-bottom: 20px;">
    <hr class="mx-3 text-white opacity-25">
    <a href="{% url 'admin_change_password' %}"><i class="fa fa-key"></i> Passwords</a>
    <a href="{% url 'admin_logout' %}" style="color: #ff4d4d;"><i class="fa fa-sign-out"></i> Logout</a>
</div>

</div>

<div class="content">

{% block content %}

{% endblock %}

</div>

</body>
</html>
