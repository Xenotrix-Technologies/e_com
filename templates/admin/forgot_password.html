<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Forgot Password | AR Handlooms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-wrapper {
            width: 100%;
            max-width: 400px;
        }
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }
        .btn-dark {
            border-radius: 8px;
            padding: 10px;
            font-weight: 600;
        }
        .form-control {
            border-radius: 8px;
            padding: 10px 15px;
        }
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<div class="reset-wrapper">
    <div class="logo-container">
        <h3 class="fw-bold text-dark">AR Handlooms</h3>
        <p class="text-muted small">Admin Panel Recovery</p>
    </div>

    <div class="card p-4">
        <h4 class="text-center mb-4">Reset Password</h4>

        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label for="username_or_email" class="form-label small fw-bold">Username or Email</label>
                <input type="text" name="username_or_email" id="username_or_email" class="form-control" required placeholder="Enter admin username or email">
            </div>

            <div class="mb-3">
                <label for="new_password" class="form-label small fw-bold">New Password</label>
                <input type="password" name="new_password" id="new_password" class="form-control" required placeholder="Enter new password">
            </div>

            <div class="mb-3">
                <label for="confirm_password" class="form-label small fw-bold">Confirm New Password</label>
                <input type="password" name="confirm_password" id="confirm_password" class="form-control" required placeholder="Confirm new password">
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-dark">Reset Password</button>
                <a href="{% url 'admin_login' %}" class="btn btn-link text-muted text-decoration-none small">Back to Login</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
